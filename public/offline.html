<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Campaign Builder — Offline</title>
  <style>
    :root {
      --bg: light-dark(#f3ecdd, #171209);
      --fg: light-dark(#2a2118, #e8dcc8);
      --accent: #9d2f21;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .offline-card {
      text-align: center;
      max-width: 400px;
    }
    .offline-card h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }
    .offline-card p {
      line-height: 1.6;
      opacity: 0.8;
    }
    .offline-card button {
      margin-top: 1.5rem;
      padding: 0.6rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .offline-card button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <h1>You're offline</h1>
    <p>Campaign Builder needs an internet connection to load for the first time. Once loaded, it works fully offline.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
